path_base: repository-root
scope: >-
  覆盖当前 CLI 的启动与本地构建、Agent 对话与工具循环、模型接口适配、
  Provider 连接、Agent 设置、终端交互、文件读写、命令执行及 GitHub Release 发布主链路。内容基于源码核对，用于定位实现，
  不代表真实模型端点、终端或跨平台行为已经运行验收。
not_yet_mapped:
  - VSCode 调试配置
features:
  - id: release
    name: GitHub Actions 发布、安装包与 Release Notes
    keywords: [GitHub Actions, release, tag, feat, fix, 发布说明, release notes, npm pack]
    doc: docs/features/release.md
    entrypoints: [.github/workflows/release.yml, scripts/release-notes.mjs]
  - id: cli-startup
    name: CLI 启动、本地构建与开发检查
    keywords:
      [
        启动,
        配置,
        无环境变量,
        npm,
        build,
        liberi-code,
        commitlint,
        Conventional Commits,
        Husky,
        Prettier,
        format,
        Codex,
        hook,
      ]
    doc: docs/features/cli-startup.md
    entrypoints: [src/index.tsx, package.json, scripts/build.mjs]
  - id: agent-loop
    name: Agent 对话历史、工具循环与系统提示词
    keywords:
      [
        Agent,
        send,
        ReAct,
        对话,
        上下文,
        工具调用,
        AgentUpdate,
        系统提示词,
        buildSystemPrompt,
        AGENTS.md,
        全局指令,
      ]
    doc: docs/features/agent-loop.md
    entrypoints: [src/core/agent.ts, src/core/prompt.ts]
  - id: model-adapter
    name: OpenAI 兼容模型接口与 Token 用量
    keywords:
      [
        OpenAILLM,
        LLM,
        Chat Completions,
        模型,
        非流式,
        token,
        TokenUsage,
        cached_tokens,
        缓存命中,
        协议转换,
      ]
    doc: docs/features/model-adapter.md
    entrypoints: [src/openai-llm.ts, src/types.ts]
  - id: providers
    name: Provider 连接、模型选择、模型清单缓存与本地保存
    keywords:
      [
        provider,
        ProviderList,
        ProviderSession,
        ModelList,
        List,
        model,
        切换模型,
        删除供应商,
        移除配置,
        双按D,
        服务商,
        API Key,
        模型列表,
        models,
        DeepSeek,
        MiniMax,
        GLM,
        MiMo,
        小米,
        Kimi,
        OpenAI官方,
        Token Plan,
        Coding Plan,
        自定义端点,
        自动连接,
      ]
    doc: docs/features/providers.md
    entrypoints: [src/providers/catalog.ts, src/providers/connect.ts, src/ui/ProviderList.tsx]
  - id: settings
    name: Agent 设置、权限模式、统一配置文件与 subagent 模型占位
    keywords:
      [
        config,
        ConfigList,
        PermissionList,
        settings.json,
        subagent model,
        subagentModel,
        permission,
        工作区写入,
        完全许可,
        设置,
        全局配置,
      ]
    doc: docs/features/settings.md
    entrypoints: [src/core/settings.ts, src/ui/ConfigList.tsx, src/ui/List.tsx]
  - id: terminal-ui
    name: 终端输入、消息展示与布局
    keywords:
      [
        Ink,
        React,
        TUI,
        App,
        Message,
        Markdown,
        marked,
        string-width,
        表格,
        输入,
        Thinking,
        think,
        工具摘要,
        resize,
        状态栏,
        工具栏,
        Toolbar,
        缓存命中率,
        斜杠命令,
        slash,
        compact,
        model,
        quit,
        CommandInput,
      ]
    doc: docs/features/terminal-ui.md
    entrypoints: [src/ui/App.tsx, src/core/commands.ts, src/hook/useCommands.ts]
  - id: file-tools
    name: 文件读写与工作目录路径权限
    keywords:
      [
        file_read,
        file_write,
        fileRead,
        fileWrite,
        usePathValidation,
        文件,
        权限,
        realpath,
        工作目录,
      ]
    doc: docs/features/file-tools.md
    entrypoints: [src/tools/file-read.ts, src/tools/file-write.ts, src/hook/usePathValidation.ts]
  - id: terminal-tool
    name: Shell 命令执行与 PowerShell、Bash 路径检查
    keywords:
      [
        terminal_run,
        terminalRun,
        命令,
        Shell,
        PowerShell,
        CMD,
        bash,
        stdout,
        stderr,
        checkTerminalCommandPermission,
        getBashPaths,
        路径权限,
        通配符,
        重定向,
        符号链接,
      ]
    doc: docs/features/terminal-tool.md
    entrypoints:
      [
        src/tools/terminal-run.ts,
        src/utils/command-permission/terminal-permission.ts,
        src/utils/shell.ts,
      ]
