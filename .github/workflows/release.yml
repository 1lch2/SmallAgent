name: Release

on:
  push:
    # Tag ref 由下面的前置步骤检查是否属于 master 历史。
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 检查 tag 是否属于 master 历史
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tags must point to a commit in master history."
            exit 1
          fi

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 编译
        run: npm run build

      - name: 打包
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          if [ "$tag" != "$expected_tag" ]; then
            echo "::error::Tag $tag does not match package.json version tag $expected_tag."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; increment package.json version to publish another release."
            exit 0
          fi

          gh release create "$tag" "$RUNNER_TEMP"/release/*.tgz \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes
